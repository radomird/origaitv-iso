name: ISO

# Builds OrigaiTV's ISO and installs it in a VM (ADR-019, layer 5). The ISO is
# omarchy-iso's own build with Omarchy's own packages; the only addition is
# OrigaiTV's signed packages, which configs/airootfs/root/customize_airootfs.sh
# adds to the offline mirror and the install (ADR-025). Then upstream's own
# install test (an unattended install in QEMU with KVM and a boot of the
# installed system), then OrigaiTV's image checks in test/origaitv/image/.
#
# It runs on pull requests that touch the build, once they're ready for
# review (the gate job below says when), on release tags and by hand. A
# merge to origaitv doesn't rebuild it: the nightly run in origaitv-os builds the
# edge ISO every night, from this branch.
#
# A pull request's run builds the TV's packages itself, from origaitv-os's
# origaitv, or from origaitv-os's branch of the same name when there is one.
# Edge's are only rebuilt each night, so for most of a day after a change
# lands in both repos, an ISO with edge's packages would test the new stick
# against yesterday's TV. The build is origaitv-pkgs' own (bin/build and
# bin/sign), the one origaitv-os's image workflow runs, signed with a
# throwaway key made in the run that only this run's box trusts. So no key
# of OrigaiTV's is needed here, and none leaves the run.
#
# A release tag is origaitv-v1.0.0, a candidate's origaitv-v1.0.0-rc1, and a 0.x
# release was v0.2.0 (bin/origaitv-iso-tag). A release's ISO carries stable's
# packages, and a candidate's carries edge's. Either way the run first
# checks that the package is the one the ISO's name promises
# (bin/origaitv-iso-carries): the release itself, or for a candidate the
# commit origaitv-os tagged with the same name. Any other tag that starts the
# run fails it, and keeps nothing.
#
# The screenshots are always kept. The ISO, about 6.4 GB, is over GitHub's
# 2 GiB cap for release assets, so a tag or a run by hand keeps it as a
# workflow artifact. This workflow has no keys and publishes nothing: when a
# release tag's run passes, publish-iso.yml takes the ISO it kept, signs its
# checksum and puts it in OrigaiTV's R2 bucket for people to download.

on:
  push:
    tags: ["origaitv-v*", "v*"]
  pull_request:
    # ready_for_review: a draft gets no ISO run, so marking it ready is what
    # starts its one full run. labeled: the "image" label asks for one by
    # hand, on a draft too.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "bin/**"
      - "builder/**"
      - "configs/**"
      - "test/**"
      - "archiso"
      - ".github/workflows/iso.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "OrigaiTV package channel the ISO carries, or build to build them from origaitv-os's origaitv"
        type: choice
        options: [edge, stable, build]
        default: edge
      keep-iso:
        description: "Keep the ISO as an artifact"
        type: boolean
        default: false
      ref:
        description: "Branch or commit to build (empty: the one this runs on)"
        type: string
        default: ""
      checks:
        description: "Only these image checks, by name, like s5.6-setup update-tv (empty: every check)"
        type: string
        default: ""
      release:
        description: "A stand-in release the ISO says it is, like 0.0.0-rc1, to check what a release tag's ISO does (empty: none). Its ISO is never kept"
        type: string
        default: ""
  workflow_call:
    inputs:
      channel:
        type: string
        default: edge
      keep-iso:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
      checks:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Whether a pull request gets an ISO run of its own (ADR-074). Not while
  # it's a draft: marking it ready starts the run, and each push after that
  # runs it again. The "image" label asks for one by hand, on a draft too,
  # and adding it again runs it again. GitHub can't start this workflow for
  # one label and not another, so any other label starts it too, but it
  # runs nothing.
  #
  # Not when origaitv-os has an open pull request from a branch of the same
  # name either: origaitv-os's VM test builds the ISO from this branch, with
  # that change's packages, so the two are tested together, once, there.
  # That pull request's Check run leaves a notice with the origaitv-iso commit
  # it builds, so this job can say whether it builds this one.
  #
  # And not for a sync pull request: omarchy-sync.yml builds its ISO by
  # calling this workflow itself, and building it a second time would only
  # double the wait before it merges. Tags, runs by hand and workflows that
  # call this one don't ask: this job only runs for pull requests.
  gate:
    name: "Does this need an ISO run?"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide, and say why
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'image') }}
        run: |
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run=false
          if [[ $HEAD_REF == omarchy-sync/* ]]; then
            say "No ISO run here: it's an Omarchy sync, and omarchy-sync.yml builds its ISO."
          elif [[ $ACTION == "labeled" && $LABEL != "image" ]]; then
            say "No ISO run for the \`$LABEL\` label. Only the image label starts one."
          elif [[ $LABELED == "true" ]]; then
            run=true
            say "The ISO runs: it has the image label."
          elif [[ $DRAFT == "true" ]]; then
            say "No ISO run yet: it's a draft. Marking it ready starts one, unless origaitv-os has an open pull request from \`$HEAD_REF\` too. The image label runs it on a draft."
          else
            if ! pr=$(gh api -X GET "repos/$OWNER/origaitv-os/pulls" -f state=open -f head="$OWNER:$HEAD_REF" \
              --jq '.[0] // empty | "\(.number) \(.draft) \(.head.sha)"'); then
              echo "::error::Couldn't ask origaitv-os for an open pull request from $HEAD_REF. Rerun this job."
              exit 1
            fi
            if [[ -z $pr ]]; then
              run=true
              say "The ISO runs: it's ready for review, and origaitv-os has no open pull request from \`$HEAD_REF\`."
            else
              read -r number os_draft os_sha <<<"$pr"
              url="https://github.com/$OWNER/origaitv-os/pull/$number"
              say "No ISO run here: origaitv-os [#$number]($url) comes from a branch of the same name, and its VM test builds the ISO from this branch, with that change's packages. So the two are tested together, once, there."
              say ""
              if [[ $os_draft == "true" ]]; then
                say "origaitv-os #$number is a draft, so its VM test runs when it's marked ready."
              else
                notes=""
                check=$(gh api -X GET "repos/$OWNER/origaitv-os/commits/$os_sha/check-runs" -f check_name="Does this need a VM test?" \
                  --jq '.check_runs | sort_by(.started_at) | last | .id // empty') || check=""
                if [[ -n $check ]]; then
                  notes=$(gh api "repos/$OWNER/origaitv-os/check-runs/$check/annotations" --jq '.[].message') || notes=""
                fi
                if grep -q "$HEAD_SHA" <<<"$notes"; then
                  say "Its latest Check run builds this commit, \`${HEAD_SHA::7}\`: [its checks]($url/checks)."
                else
                  say "Its latest Check run, on origaitv-os \`${os_sha::7}\`, doesn't build this commit, \`${HEAD_SHA::7}\`. A push to origaitv-os's branch starts one that does. Without one, rerun origaitv-os #$number's Check run from [its checks]($url/checks), once it isn't running."
                  echo "::warning::origaitv-os #$number's VM test doesn't build this commit yet. Push its branch, or rerun its Check run."
                fi
              fi
            fi
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  iso:
    name: "Build the ISO, install it, boot it, check it"
    needs: gate
    # A pull request runs it when the gate says so. Tags, runs by hand and
    # workflows that call this one always do.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.gate.outputs.run == 'true') }}
    # Here, not on the workflow: a run whose gate says no, like another
    # label, would otherwise cancel the run already going.
    concurrency:
      group: iso-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          persist-credentials: false

      # A pushed tag is the only push that starts this workflow. It has to
      # be one of OrigaiTV's release tags, and it says which packages the ISO
      # carries: stable's for a release, edge's for a candidate. A pull
      # request's run builds them (see the top of this file). Every other
      # run carries the channel it was asked for, edge unless told. Only an
      # ISO that went through every check is kept: a release tag's always,
      # another run's when it asks.
      #
      # Only a release tag's ISO says which release it is, so for a long
      # time the first run to check that was a candidate's own, too late to
      # fix it. So a pull request's ISO says it's a stand-in release,
      # 0.0.0-rc1, which no tag will ever be, and a run by hand can ask for
      # one. That ISO is checked the way a candidate's is and then thrown
      # away: it's never kept, so there's nothing of it to publish. The
      # night's run has no release, which checks the other side.
      - name: Which packages, and whether the ISO is kept
        env:
          ASKED: ${{ inputs.channel }}
          KEEP: ${{ inputs.keep-iso }}
          ONLY: ${{ inputs.checks }}
          STAND_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '' }}
        run: |
          tag=""
          release=""
          stand_in=""
          if [[ $GITHUB_EVENT_NAME == "push" ]]; then
            tag=$GITHUB_REF_NAME
            read -r kind version < <(bin/origaitv-iso-tag "$tag") || {
              echo "::error::$tag isn't one of OrigaiTV's release tags, so no ISO is built for it. A release is origaitv-v1.0.0 and a candidate origaitv-v1.0.0-rc1."
              exit 1
            }
            channel=edge
            [[ $kind != "stable" ]] || channel=stable
            keep=true
            echo "ISO_VERSION=$version" >>"$GITHUB_ENV"
            echo "$tag is OrigaiTV $version, for the $kind channel. Its ISO carries the $channel packages." | tee -a "$GITHUB_STEP_SUMMARY"
            release=$version
          elif [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            channel=build
            keep=false
            stand_in=0.0.0-rc1
          else
            channel=${ASKED:-edge}
            keep=${KEEP:-false}
            stand_in=$STAND_IN
          fi
          if [[ -n $stand_in ]]; then
            # It has to read as a release, or the TV ignores it.
            bin/origaitv-iso-tag "origaitv-v$stand_in" >/dev/null || {
              echo "::error::$stand_in isn't a version a release can have, like 0.0.0-rc1"
              exit 1
            }
            release=$stand_in
            keep=false
            echo "This ISO says it's OrigaiTV $stand_in, a stand-in release, so the checks see what a release tag's ISO does. It isn't kept." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The ISO says which release it is, and puts that on the box it
          # installs, for Settings, System (customize.sh and
          # origaitv_handover.py).
          rm -f configs/airootfs/usr/share/origaitv-iso/release
          [[ -z $release ]] || echo "$release" >configs/airootfs/usr/share/origaitv-iso/release
          [[ -z $ONLY ]] || keep=false
          {
            echo "RELEASE_TAG=$tag"
            echo "CHANNEL=$channel"
            echo "KEEP_ISO=$keep"
          } >>"$GITHUB_ENV"

      # The build and the install need about 40 GB. GitHub's runner ships
      # toolchains this job never uses, so make room when it's short.
      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          echo "Free: $(avail) GB"
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
            echo "Free after clean-up: $(avail) GB"
          fi
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      - name: Fetch OrigaiTV's signed packages
        if: env.CHANNEL != 'build'
        env:
          ORIGAITV_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          bin/origaitv-iso-packages "$CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      # The TV built from now, not from last night. origaitv-os's branch of
      # the same name when it has one, so a change made in both repos is
      # built together. Otherwise its origaitv.
      - name: The origaitv-os commit the TV is built from
        if: env.CHANNEL == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=origaitv
          if [[ -n $HEAD_REF ]] && gh api "repos/$OWNER/origaitv-os/branches/$HEAD_REF" --silent 2>/dev/null; then
            ref=$HEAD_REF
          fi
          sha=$(gh api "repos/$OWNER/origaitv-os/commits/$ref" --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Couldn't find origaitv-os's $ref. Rerun this job."; exit 1; }
          echo "OS_SHA=$sha" >>"$GITHUB_ENV"
          echo "The TV is built from origaitv-os's $ref, [\`${sha::7}\`](https://github.com/$OWNER/origaitv-os/commit/$sha)." | tee -a "$GITHUB_STEP_SUMMARY"

      # The PKGBUILDs and the scripts that build and sign with them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANNEL == 'build'
        with:
          repository: ${{ github.repository_owner }}/origaitv-pkgs
          ref: main
          path: .origaitv-pkgs
          persist-credentials: false

      # A key made here, good for a day, that only this run's box trusts.
      # The public half goes where the build's container and the checks'
      # read it. The key itself stays in the runner's own folder.
      - name: A throwaway key for the packages
        if: env.CHANNEL == 'build'
        run: |
          .origaitv-pkgs/bin/test-key "$RUNNER_TEMP/test-key"
          mkdir -p test-runs/test-key
          cp "$RUNNER_TEMP/test-key/public.asc" test-runs/test-key/public.asc
          echo "ORIGAITV_TEST_PACKAGE_KEY=/w/test-runs/test-key/public.asc" >>"$GITHUB_ENV"
          echo "The packages are signed with a throwaway key, $(cat "$RUNNER_TEMP/test-key/fingerprint"), which only this run's box trusts." | tee -a "$GITHUB_STEP_SUMMARY"

      # Built with no key around, as origaitv-os's image workflow builds
      # them. The keyring built with them trusts the throwaway key too.
      - name: Build OrigaiTV's packages
        if: env.CHANNEL == 'build'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          start=$(date +%s)
          repo=$RUNNER_TEMP/repo
          mkdir -p "$repo"
          docker run --rm -v "$PWD/.origaitv-pkgs:/src:ro" -v "$repo:/repo" \
            -v "$PWD/test-runs/test-key:/test-key:ro" -e ORIGAITV_TEST_KEY=/test-key/public.asc \
            -e ORIGAITV_CHANNEL=edge -e ORIGAITV_REF="commit=$OS_SHA" \
            -e ORIGAITV_SOURCE="https://github.com/$OWNER/origaitv-os.git" \
            -e ORIGAITV_REPO_URL="https://github.com/$OWNER/origaitv-pkgs/releases/download" \
            ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
          # The container wrote them as its own users.
          sudo chown -R "$(id -u):$(id -g)" "$repo"
          echo "PACKAGES_SECONDS=$(($(date +%s) - start))" >>"$GITHUB_ENV"

      - name: Sign them with the run's throwaway key
        if: env.CHANNEL == 'build'
        env:
          ORIGAITV_TEST_KEY: ${{ runner.temp }}/test-key/public.asc
        run: |
          dest=configs/airootfs/usr/share/origaitv-iso/packages
          AGENTV_SIGNING_KEY=$(cat "$RUNNER_TEMP/test-key/secret.asc") .origaitv-pkgs/bin/sign "$RUNNER_TEMP/repo"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP"/repo/origaitv-*.pkg.tar.zst "$dest/"
          ls -l "$dest"
          built=$(basename "$(ls "$dest"/origaitv-[0-9]*.pkg.tar.zst)" | sed -E 's/^origaitv-(.*)-any\.pkg\.tar\.zst$/\1/')
          echo "BUILT_VERSION=$built" >>"$GITHUB_ENV"
          echo "The ISO carries origaitv $built, built in this run in $PACKAGES_SECONDS s." | tee -a "$GITHUB_STEP_SUMMARY"

      # Before the long build: a release tag's ISO is named after the tag,
      # so the package on it has to be the one that name promises.
      - name: The packages are the ones the tag stands for
        if: env.RELEASE_TAG != ''
        env:
          ORIGAITV_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          bin/origaitv-iso-carries "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Upstream's own build and install test, then OrigaiTV's checks against
      # the base image it leaves behind (test/origaitv/image/ci).
      - name: Build, install, boot, check
        env:
          ORIGAITV_OWNER: ${{ github.repository_owner }}
          # Two VMs at a time (test/origaitv/image/run).
          ORIGAITV_TEST_LANES: 2
          ONLY: ${{ inputs.checks }}
        run: |
          set -o pipefail
          read -ra checks <<<"$ONLY"
          if (( ${#checks[@]} > 0 )); then
            echo "Only these checks run: ${checks[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          test/origaitv/image/ci "${checks[@]}" 2>&1 | tee image.log

      - name: Report
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          base=$(ls -d test-runs/*-integration 2>/dev/null | head -1 || true)
          {
            echo "## ISO"
            echo
            if [[ $CHANNEL == "build" ]]; then
              echo "OrigaiTV packages: built in this run, origaitv \`${BUILT_VERSION:-?}\` from origaitv-os \`${OS_SHA::7}\`, in ${PACKAGES_SECONDS:-?} s. Build: $(cat test-runs/build-seconds 2>/dev/null || echo ?) s."
            else
              echo "OrigaiTV packages: \`$CHANNEL\`. Build: $(cat test-runs/build-seconds 2>/dev/null || echo ?) s."
            fi
            if [[ -n $base && -f $base/omarchy-install-timing.json ]]; then
              jq -r '"Install: \((.finished_at - .started_at) | round) s."' "$base/omarchy-install-timing.json"
            fi
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          test/origaitv/report iso "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" \
            "S1.1=$(result S1.1)" "S1.3=$(result S1.3)" "S1.6=$(result S1.6)" "S1.7=$(result S1.7)" \
            "T1.1=$(result T1.1)" "T1.2=$(result T1.2)" "T1.4=$(result T1.4)" \
            "T2.1=$(result T2.1)" "T2.2=$(result T2.2)" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            test-runs/build-seconds
            test-runs/*/*.png
            test-runs/*/serial.log
            test-runs/*/omarchy-install-timing.json
            test-runs/*/omarchy-install.log
            test-runs/*/first-boot-systemd-analyze.txt
            test-runs/*/runs/**/*.png
            test-runs/*/runs/**/*.txt
            test-runs/*/runs/**/*.json
            test-runs/*/runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # The name people download (ADR-027), given only now: upstream's test
      # harness reads which packages the ISO has from its file name.
      - name: Name the ISO
        if: success() && env.KEEP_ISO == 'true'
        id: name
        run: |
          # A release tag's own run is named for the tag's version. Any
          # other run, one started by hand on a tag too, is named for the
          # packages it carries and the commit it built, which isn't always
          # the one it runs on. Nothing publishes those.
          if [[ -n $RELEASE_TAG ]]; then
            name="origaitv-$ISO_VERSION-x86_64"
          else
            name="origaitv-$CHANNEL-$(git rev-parse HEAD | cut -c1-7)-x86_64"
          fi
          mv release/*.iso "release/$name.iso"
          (cd release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && env.KEEP_ISO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            release/*.iso
            release/*.iso.sha256
          compression-level: 0
          retention-days: 30

      # The checksum on its own too, a few bytes: publish-iso.yml signs it
      # without fetching the ISO.
      - name: Keep the checksum
        if: success() && env.KEEP_ISO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}.sha256
          path: release/*.iso.sha256
          if-no-files-found: error
          retention-days: 30
